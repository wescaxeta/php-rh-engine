name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Estilo de código + análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHP-CS-Fixer (PER-CS)
        run: composer cs

      - name: PHPStan (nível max)
        run: composer analyse -- --error-format=github

  tests:
    name: Testes (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: PHPUnit com cobertura
        run: vendor/bin/phpunit --testdox --coverage-text --only-summary-for-coverage-text | tee phpunit.log

      - name: Resumo de cobertura
        if: matrix.php == '8.4'
        run: |
          echo '### Cobertura de testes' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A4 'Summary:' phpunit.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
